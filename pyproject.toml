[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "python-dhip"
version = "0.1.0"
description = "Pure-stdlib client for Dahua DHIP (RPC2) IP cameras"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "John" }]
keywords = ["dahua", "dhip", "rpc2", "ip-camera", "cctv", "ptz"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video :: Capture",
    "Topic :: System :: Networking",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/NeiroNx/python-dvr"
Source = "https://github.com/"

[project.scripts]
dhip = "dahua.cli:main"

[tool.setuptools]
packages = ["dahua"]
py-modules = ["dhip"]
