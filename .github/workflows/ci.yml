name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.9 is EOL and has no build for ubuntu-latest (Ubuntu 26.04),
          # so its row is pinned to the last runner image that ships one.
          # The job name must stay "test (3.9)": it is a required status
          # check in branch protection.
          - python-version: "3.9"
            runner: ubuntu-24.04
          - python-version: "3.10"
            runner: ubuntu-latest
          - python-version: "3.11"
            runner: ubuntu-latest
          - python-version: "3.12"
            runner: ubuntu-latest
          - python-version: "3.13"
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests (stdlib only, no network)
        run: |
          python -m unittest discover -s tests -v
          python tests/test_loopback.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and verify the package
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - name: Verify install + console entry point
        run: |
          python -m pip install dist/*.whl
          dhip --help
          python -c "import dahua; print('dahua', dahua.__version__)"
